[project]
name = "serum-preset-generator"
version = "1.0.0"
description = "Validates and writes Xfer Serum 1 presets over MCP; no model, no API key"
readme = "README.md"
license = "MIT"
authors = [
    { name = "biogin" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2",
]

[project.scripts]
serum-gen = "serum_preset_generator.cli:main"
serum-gen-mcp = "serum_preset_generator.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
