[project]
name = "serum-preset-generator"
version = "0.1.0"
description = "Turn a sound description into a Serum 1 patch recipe and preset"
readme = "README.md"
authors = [
    { name = "Wreble", email = "youdontneed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.3",
]

[project.scripts]
serum-gen = "serum_preset_generator.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
